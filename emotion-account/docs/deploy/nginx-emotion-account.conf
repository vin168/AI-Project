# Nginx config snippet for Emotion Account API
#
# Copy to: /etc/nginx/conf.d/emotion-account.conf
# Then: nginx -t && systemctl reload nginx

# HTTP: keep 80 open for ACME (Let's Encrypt), then redirect to HTTPS.
server {
  listen 80;
  server_name stunningvin.abrdns.com;

  # ACME challenge (recommended even if you use certbot --nginx)
  location /.well-known/acme-challenge/ {
    root /var/www/letsencrypt;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

